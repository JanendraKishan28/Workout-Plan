<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Janendra's Training Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #171718;
    --surface2: #1f1f21;
    --surface3: #272729;
    --border: #2e2e31;
    --border2: #3a3a3e;
    --text: #f0eff0;
    --text2: #9998a0;
    --text3: #5c5b63;
    --accent: #c8ff57;
    --accent-dim: #9bc43e;
    --accent-bg: rgba(200,255,87,0.08);
    --accent-bg2: rgba(200,255,87,0.14);
    --push: #7c9fff;
    --pull: #c084fc;
    --legs: #4ade80;
    --upper: #fb923c;
    --cardio: #f472b6;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; min-height: 100dvh; }
  .mono { font-family: 'DM Mono', monospace; }

  /* Header */
  .header { padding: 20px 16px 0; display: flex; align-items: flex-start; justify-content: space-between; }
  .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-left p { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .week-badge { background: var(--accent-bg2); border: 1px solid rgba(200,255,87,0.3); color: var(--accent); font-family: 'DM Mono', monospace; font-size: 12px; padding: 5px 10px; border-radius: 20px; cursor: pointer; white-space: nowrap; }

  /* Week nav */
  .week-nav { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
  .week-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); width: 36px; height: 36px; border-radius: var(--radius-sm); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .week-nav button:active { transform: scale(0.93); }
  .week-info { flex: 1; text-align: center; }
  .week-info .week-num { font-size: 18px; font-weight: 700; }
  .week-info .week-dates { font-size: 12px; color: var(--text2); margin-top: 1px; }

  /* Progress summary */
  .summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 14px 16px 0; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .stat-val { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* Day selector */
  .day-scroll { display: flex; gap: 8px; padding: 14px 16px 0; overflow-x: auto; scrollbar-width: none; }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-pill { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .day-pill.active { border-color: var(--accent); background: var(--accent-bg2); color: var(--accent); }
  .day-pill.completed { border-color: var(--border2); background: var(--surface2); }
  .day-pill.completed::after { content: ' ✓'; color: var(--accent); font-size: 11px; }

  /* Day panel */
  .day-panel { padding: 14px 16px; }
  .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .day-type-badge { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; font-family: 'DM Mono', monospace; }
  .day-title-text { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }

  /* Warmup section */
  .section-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .section-block-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; user-select: none; }
  .section-block-header h3 { font-size: 13px; font-weight: 500; color: var(--text2); display: flex; align-items: center; gap: 8px; }
  .section-block-header .chevron { color: var(--text3); font-size: 12px; transition: transform 0.2s; }
  .section-block-header.open .chevron { transform: rotate(180deg); }
  .section-block-body { padding: 0 14px 14px; display: none; }
  .section-block-body.open { display: block; }
  .warmup-item { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .warmup-item:last-child { border: none; }
  .warmup-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
  .warmup-duration { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); margin-left: auto; white-space: nowrap; }

  /* Exercise cards */
  .ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .ex-card-header { padding: 12px 14px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .ex-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
  .ex-sets-badge { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
  .ex-note { font-size: 12px; color: var(--text2); padding: 0 14px 10px; line-height: 1.5; }
  .ex-note-border { border-top: 1px solid var(--border); padding: 8px 14px; font-size: 12px; color: var(--text3); line-height: 1.5; font-style: italic; }

  /* Set logger */
  .set-logger { border-top: 1px solid var(--border); padding: 10px 14px; }
  .set-logger-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .set-logger-header span { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }
  .set-row { display: grid; grid-template-columns: 32px 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  .set-num { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; text-align: center; }
  .set-input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 14px; font-family: 'DM Mono', monospace; color: var(--text); text-align: center; width: 100%; outline: none; }
  .set-input:focus { border-color: var(--accent); background: var(--accent-bg); }
  .set-input::placeholder { color: var(--text3); font-size: 12px; }
  .set-done-btn { width: 32px; height: 36px; background: var(--surface3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text3); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .set-done-btn.done { background: var(--accent-bg2); border-color: var(--accent); color: var(--accent); }
  .set-input-label { font-size: 10px; color: var(--text3); text-align: center; margin-top: -2px; font-family: 'DM Mono', monospace; }
  .add-set-btn { width: 100%; margin-top: 6px; padding: 7px; background: transparent; border: 1px dashed var(--border2); border-radius: var(--radius-sm); color: var(--text3); font-size: 12px; cursor: pointer; }
  .add-set-btn:active { background: var(--surface3); }

  /* Finisher */
  .finisher-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; padding: 14px; }
  .finisher-label { font-size: 11px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .finisher-item { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin-bottom: 6px; line-height: 1.4; }
  .finisher-item:last-child { margin: 0; }
  .finisher-bullet { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .hiit-block { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px; }
  .hiit-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .hiit-row:last-child { border: none; }
  .hiit-phase { color: var(--text2); }
  .hiit-time { font-family: 'DM Mono', monospace; font-size: 12px; }

  /* Complete day button */
  .complete-btn { width: 100%; padding: 14px; background: var(--accent-bg2); border: 1.5px solid rgba(200,255,87,0.4); border-radius: var(--radius); color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; letter-spacing: 0.02em; transition: all 0.15s; }
  .complete-btn:active { transform: scale(0.98); }
  .complete-btn.done { background: var(--accent); color: #0e0e0f; border-color: var(--accent); }

  /* History tab */
  .tab-bar { display: flex; gap: 0; padding: 14px 16px 0; border-bottom: 1px solid var(--border); margin: 0 0 0; }
  .tab-btn { flex: 1; padding: 10px; font-size: 13px; font-weight: 500; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* History view */
  .history-view { padding: 14px 16px; }
  .history-week { margin-bottom: 16px; }
  .history-week-header { font-size: 13px; font-family: 'DM Mono', monospace; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .history-day-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .history-day-name { font-size: 14px; font-weight: 500; }
  .history-day-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .history-tag { font-size: 11px; font-family: 'DM Mono', monospace; padding: 3px 8px; border-radius: 10px; }

  /* Progress charts */
  .progress-view { padding: 14px 16px; }
  .ex-select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 14px; font-family: 'DM Mono', monospace; margin-bottom: 14px; outline: none; }
  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .chart-area { height: 140px; position: relative; margin-bottom: 8px; }
  .chart-svg { width: 100%; height: 100%; overflow: visible; }
  .no-data { text-align: center; color: var(--text3); font-size: 13px; padding: 30px 0; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--accent); color: #0e0e0f; font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: 20px; z-index: 999; transition: transform 0.3s ease; pointer-events: none; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>

<div class="toast" id="toast">Saved!</div>

<div class="header">
  <div class="header-left">
    <h1>Training Log</h1>
    <p>Hypertrophy + Cardio Plan</p>
  </div>
  <div class="week-badge" id="weekBadge">WK 1</div>
</div>

<div class="week-nav">
  <button onclick="changeWeek(-1)">‹</button>
  <div class="week-info">
    <div class="week-num" id="weekNum">Week 1</div>
    <div class="week-dates" id="weekDates"></div>
  </div>
  <button onclick="changeWeek(1)">›</button>
</div>

<div class="summary">
  <div class="stat"><div class="stat-val mono" id="statDays">0</div><div class="stat-label">Days done</div></div>
  <div class="stat"><div class="stat-val mono" id="statSets">0</div><div class="stat-label">Sets logged</div></div>
  <div class="stat"><div class="stat-val mono" id="statVol">0</div><div class="stat-label">Total kg</div></div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('train')">Train</button>
  <button class="tab-btn" onclick="switchTab('history')">History</button>
  <button class="tab-btn" onclick="switchTab('progress')">Progress</button>
</div>

<div id="trainView">
  <div class="day-scroll" id="dayScroll"></div>
  <div class="day-panel" id="dayPanel"></div>
</div>

<div id="historyView" style="display:none;"><div class="history-view" id="historyContent"></div></div>
<div id="progressView" style="display:none;">
  <div class="progress-view">
    <select class="ex-select" id="exSelect" onchange="renderChart()"></select>
    <div class="chart-wrap" id="chartWrap"><div class="no-data">Log some sets to see progress</div></div>
  </div>
</div>

<script>
const PLAN = [
  {
    id: 'push', label: 'Push', color: '#7c9fff', shortLabel: 'Day 1',
    title: 'Push — Chest, Shoulders, Triceps',
    warmup: [
      { text: '5 min light cardio (treadmill walk or bike)', dur: '5 min' },
      { text: 'Arm circles — 10 forward, 10 backward', dur: '1 min' },
      { text: 'Band pull-aparts — 2 × 15', dur: '1 min' },
      { text: 'Shoulder CARs (controlled articular rotations) — 5 each side', dur: '1 min' },
      { text: 'Incline push-ups — 2 × 10 (activate chest before loading)', dur: '1 min' },
      { text: 'Bench warm-up sets: empty bar × 10, 40% × 8, 60% × 5', dur: '3 min' },
    ],
    exercises: [
      { name: 'Flat barbell bench press', sets: '4 × 6–10', note: 'Primary strength movement. Start at 60–70% of old max and build up weekly.' },
      { name: 'Incline dumbbell press', sets: '3 × 10–12', note: 'Elbows at ~45°. Control the descent.' },
      { name: 'Cable chest fly (low to high)', sets: '3 × 12–15', note: 'Full stretch at bottom, squeeze at top.' },

      { name: 'Lateral raises', sets: '3 × 15–20', note: 'Light weight, controlled. Elbows slightly bent.' },

      { name: 'Overhead tricep extension (cable)', sets: '2 × 12–15', note: '' },
    ],

  },
  {
    id: 'pull', label: 'Pull', color: '#c084fc', shortLabel: 'Day 2',
    title: 'Pull — Back, Biceps, Rear Delts',
    warmup: [
      { text: '5 min rowing machine at easy pace (perfect warm-up for pull day)', dur: '5 min' },
      { text: 'Cat-cow stretches — 10 reps (lumbar prep for deadlifts)', dur: '1 min' },
      { text: 'Hip hinge drill with dowel/broomstick — 10 reps (learn the pattern)', dur: '1 min' },
      { text: 'Band pull-aparts — 2 × 15', dur: '1 min' },
      { text: 'Dead hangs from pull-up bar — 2 × 20 sec (decompress spine, activate lats)', dur: '1 min' },
      { text: 'Deadlift warm-up sets: empty bar × 8, 40% × 6, 60% × 4', dur: '3 min' },
    ],
    exercises: [
      { name: 'Conventional deadlift', sets: '4 × 5–8', note: 'Start at 50–60% of old max. Focus on hinge pattern before adding load.' },
      { name: 'Seated cable row (wide grip)', sets: '3 × 10–12', note: 'Drive elbows back, chest tall. Don\'t round forward.' },
      { name: 'Lat pulldown (wide overhand)', sets: '3 × 10–12', note: 'Or assisted pull-ups if available.' },
      { name: 'Single-arm dumbbell row', sets: '3 × 10–12 ea', note: 'Full range — let the shoulder blade move.' },
      { name: 'Face pulls (cable, rope)', sets: '3 × 15–20', note: 'External rotation at the top. Crucial for shoulder health.' },
      { name: 'Hammer curl', sets: '3 × 12–15', note: '' },
      { name: 'Incline dumbbell curl', sets: '2 × 12–15', note: 'Full stretch on the bicep at the bottom.' },
    ],
    finisher: { type: 'hiit', label: 'Treadmill HIIT (incline focus)', rounds: 6, phases: [{ label: 'Walk flat (warmup)', time: '2 min' },{ label: 'Incline walk at 8–10% grade', time: '45 sec' },{ label: 'Flat walk (recover)', time: '60 sec' },{ label: 'Incline walk at 10–12% grade', time: '45 sec' },{ label: 'Flat walk (recover)', time: '60 sec' },{ label: 'Repeat ×6 total rounds', time: '' },{ label: 'Walk (cooldown)', time: '2 min' }], total: '~14 min' }
  },
  {
    id: 'legs', label: 'Legs', color: '#4ade80', shortLabel: 'Day 3',
    title: 'Legs & Core — Squat-free',
    warmup: [
      { text: '5 min stationary bike (easy pace, loosen hips)', dur: '5 min' },
      { text: 'Glute bridges on floor — 2 × 15 (activate glutes before loading)', dur: '1 min' },
      { text: 'Leg swings — 10 forward/back and 10 side-to-side each leg', dur: '1 min' },
      { text: 'Hip flexor stretch — 30 sec each side (counter sitting all day)', dur: '1 min' },
      { text: 'Bodyweight good mornings — 2 × 10 (prep hip hinge for RDL)', dur: '1 min' },

    ],
    exercises: [
      { name: 'Romanian deadlift (RDL)', sets: '4 × 10–12', note: 'Best squat replacement. Load progressively each week.' },

      { name: 'Walking lunges (BW or light DBs)', sets: '3 × 12 each leg', note: 'Controlled. Knee tracks over second toe.' },
      { name: 'Lying leg curl (machine)', sets: '3 × 12–15', note: 'Slow 3-sec eccentric on the way down.' },
      { name: 'Hip thrust (barbell or machine)', sets: '3 × 12–15', note: 'Chin tucked, drive through heels.' },
      { name: 'Calf raise (seated or standing)', sets: '4 × 15–20', note: 'Full range. Pause at the stretch.' },
      { name: 'Plank', sets: '3 × 30–60 sec', note: '' },
      { name: 'Ab wheel rollout or cable crunch', sets: '3 × 10–15', note: '' },
    ],
    finisher: { type: 'hiit', label: 'Incline Treadmill HIIT', rounds: 8, phases: [{ label: 'Walk flat (warmup)', time: '2 min' },{ label: 'Fast incline walk 10–12%', time: '40 sec' },{ label: 'Slow walk (recover)', time: '50 sec' },{ label: 'Repeat ×8 total rounds', time: '' },{ label: 'Walk flat (cooldown)', time: '2 min' }], total: '~13 min' }
  },
  {
    id: 'upper', label: 'Upper', color: '#fb923c', shortLabel: 'Day 5',
    title: 'Upper Body — Full',
    warmup: [
      { text: '5 min light treadmill or rowing machine', dur: '5 min' },
      { text: 'Thoracic spine rotation — 10 each side (great for desk workers)', dur: '1 min' },
      { text: 'Band pull-aparts — 2 × 15', dur: '1 min' },
      { text: 'Shoulder dislocates with band — 10 reps (improves overhead mobility)', dur: '1 min' },
      { text: 'Push-up to downward dog — 8 reps', dur: '1 min' },
      { text: 'Warm-up sets on first compound movement: empty bar × 10, 40% × 8, 60% × 5', dur: '3 min' },
    ],
    exercises: [
      { name: 'Incline barbell or dumbbell press', sets: '4 × 8–10', note: 'Alternate with Day 1 flat press as primary movement.' },
      { name: 'Chest-supported row', sets: '4 × 10–12', note: 'Machine or incline bench DB row. Takes lower back out.' },
      { name: 'Cable pullover', sets: '3 × 12–15', note: 'Great for lat lengthening and serratus activation.' },
      { name: 'Lateral raise superset rear delt fly', sets: '3 × 15+15', note: 'Back-to-back, no rest between exercises in the superset.' },

      { name: 'Close-grip bench or skull crushers', sets: '3 × 10–12', note: 'Tricep focus.' },
    ],
    finisher: { type: 'hiit', label: 'Sprint Treadmill HIIT', rounds: 6, phases: [{ label: 'Walk (warmup)', time: '2 min' },{ label: 'Run at 80% effort', time: '20 sec' },{ label: 'Walk (recover)', time: '40 sec' },{ label: 'Repeat ×10 rounds', time: '' },{ label: 'Walk (cooldown)', time: '2 min' }], total: '~12 min' }
  },
  {
    id: 'cardio', label: 'Cardio', color: '#f472b6', shortLabel: 'Day 6',
    title: 'Cardio & Core',
    warmup: [
      { text: '3 min easy walk on treadmill', dur: '3 min' },
      { text: 'World\'s greatest stretch — 5 each side (full body mobilisation)', dur: '2 min' },
      { text: 'Dead bugs — 2 × 8 each side (core activation)', dur: '1 min' },
    ],
    exercises: [
      { name: 'Rowing machine — steady state', sets: '15–20 min', note: 'Zone 2 pace. You should be able to hold a conversation throughout.' },
      { name: 'Incline treadmill walk or cycling', sets: '10 min', note: 'Moderate heart rate — not max effort.' },
      { name: 'Cable crunch', sets: '3 × 15–20', note: '' },
      { name: 'Hanging knee raise', sets: '3 × 12–15', note: 'Control the movement — don\'t swing.' },
      { name: 'Pallof press (cable anti-rotation)', sets: '3 × 12 ea side', note: 'Underrated for core stability and lower back health.' },
      { name: 'Bodyweight squats', sets: '3 × 20', note: 'Controlled depth, no weight — active recovery.' },
    ],
    finisher: { type: 'hiit', label: 'Optional Treadmill HIIT', rounds: 10, phases: [{ label: 'Walk (warmup)', time: '2 min' },{ label: 'Run at 70–75% effort', time: '20 sec' },{ label: 'Walk (recover)', time: '40 sec' },{ label: 'Repeat ×10 rounds', time: '' },{ label: 'Walk (cooldown)', time: '3 min' }], total: '~15 min', optional: true }
  },
];

let currentWeek = 1;
let currentDay = 0;
let currentTab = 'train';
let store = JSON.parse(localStorage.getItem('wt_store') || '{}');

function save() {
  localStorage.setItem('wt_store', JSON.stringify(store));
}

function weekKey(w) { return 'w' + w; }
function dayKey(w, d) { return 'w' + w + '_d' + d; }

function getWeekData(w) {
  return store[weekKey(w)] || {};
}

function getDayData(w, d) {
  const wk = getWeekData(w);
  return wk['d' + d] || { sets: {}, done: false };
}

function setDayData(w, d, data) {
  if (!store[weekKey(w)]) store[weekKey(w)] = {};
  store[weekKey(w)]['d' + d] = data;
  save();
}

function getWeekStart(weekNum) {
  const now = new Date();
  const dayOfWeek = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
  monday.setDate(monday.getDate() + (weekNum - currentWeek) * 7);
  return monday;
}

function formatWeekDates(weekNum) {
  const start = getWeekStart(weekNum);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
  return fmt(start) + ' – ' + fmt(end);
}

function changeWeek(dir) {
  currentWeek = Math.max(1, currentWeek + dir);
  renderAll();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', ['train','history','progress'][i] === tab));
  document.getElementById('trainView').style.display = tab === 'train' ? '' : 'none';
  document.getElementById('historyView').style.display = tab === 'history' ? '' : 'none';
  document.getElementById('progressView').style.display = tab === 'progress' ? '' : 'none';
  if (tab === 'history') renderHistory();
  if (tab === 'progress') renderProgress();
}

function renderAll() {
  document.getElementById('weekBadge').textContent = 'WK ' + currentWeek;
  document.getElementById('weekNum').textContent = 'Week ' + currentWeek;
  document.getElementById('weekDates').textContent = formatWeekDates(currentWeek);
  renderSummary();
  renderDayPills();
  renderDayPanel();
}

function renderSummary() {
  const wd = getWeekData(currentWeek);
  let days = 0, sets = 0, vol = 0;
  PLAN.forEach((_, di) => {
    const dd = wd['d' + di];
    if (!dd) return;
    if (dd.done) days++;
    if (dd.sets) {
      Object.values(dd.sets).forEach(ex => {
        ex.forEach(s => {
          if (s.done) {
            sets++;
            vol += (parseFloat(s.kg) || 0) * (parseInt(s.reps) || 0);
          }
        });
      });
    }
  });
  document.getElementById('statDays').textContent = days;
  document.getElementById('statSets').textContent = sets;
  const volK = vol >= 1000 ? (vol/1000).toFixed(1) + 'k' : Math.round(vol);
  document.getElementById('statVol').textContent = volK;
}

function renderDayPills() {
  const wd = getWeekData(currentWeek);
  document.getElementById('dayScroll').innerHTML = PLAN.map((d, i) => {
    const dd = wd['d' + i] || {};
    return `<button class="day-pill${i === currentDay ? ' active' : ''}${dd.done ? ' completed' : ''}" 
      style="${i === currentDay ? 'border-color:' + d.color + ';background:' + d.color + '18;color:' + d.color : ''}"
      onclick="selectDay(${i})">${d.shortLabel} · ${d.label}</button>`;
  }).join('');
}

function selectDay(i) {
  currentDay = i;
  renderDayPills();
  renderDayPanel();
}

function renderDayPanel() {
  const day = PLAN[currentDay];
  const dd = getDayData(currentWeek, currentDay);
  if (!dd.sets) dd.sets = {};

  let warmupItems = day.warmup.map(w =>
    `<div class="warmup-item"><div class="warmup-dot"></div><span>${w.text}</span><span class="warmup-duration">${w.dur}</span></div>`
  ).join('');

  const warmupNote = `<div style="margin-top:10px; padding:10px 12px; background:var(--surface3); border-radius:var(--radius-sm); font-size:12px; color:var(--text2); line-height:1.6;">
    <strong style="color:var(--accent); font-weight:500;">Important:</strong> These warm-up sets are <em>not</em> logged in the tracker and do <em>not</em> count toward your working sets. 
    Complete the full warm-up sequence above <strong style="font-weight:500;">before</strong> starting your first exercise. 
    The barbell/weight warm-up sets listed (empty bar, 40%, 60%) are sub-maximal — they prime your joints and nervous system only. 
    You will not feel fatigued from them. Once done, move straight into your working sets below.
  </div>`;

  const workingSetsNote = `<div style="margin-bottom:10px; padding:10px 12px; background:var(--accent-bg); border:1px solid rgba(200,255,87,0.2); border-radius:var(--radius-sm); font-size:12px; color:var(--text2); line-height:1.6;">
    <strong style="color:var(--accent); font-weight:500;">Working sets</strong> — these are your full-effort sets logged below. 
    Use the <strong style="font-weight:500;">same weight across all sets</strong> (straight sets). 
    When you can complete all sets at the top of the rep range with good form, add <strong style="font-weight:500;">2.5–5kg next session</strong>. 
    Rest <strong style="font-weight:500;">60–90 sec</strong> between sets for isolation exercises, <strong style="font-weight:500;">2–3 min</strong> for compound lifts (bench, deadlift, RDL, leg press).
    Tick ✓ each set as you complete it.
  </div>`;

  let exHtml = workingSetsNote + day.exercises.map((ex, ei) => {
    const key = 'ex' + ei;
    if (!dd.sets[key]) dd.sets[key] = [{ kg: '', reps: '', done: false }];
    const repRange = ex.sets;
    const isCompound = ['bench','deadlift','rdl','romanian','leg press','hip thrust','row','pulldown','pull-up'].some(k => ex.name.toLowerCase().includes(k));
    const restTime = isCompound ? '2–3 min rest between sets' : '60–90 sec rest between sets';

    let setRows = dd.sets[key].map((s, si) =>
      `<div class="set-row">
        <div class="set-num">${si + 1}</div>
        <div>
          <input class="set-input" type="number" placeholder="kg" value="${s.kg}" inputmode="decimal"
            onchange="updateSet(${ei},${si},'kg',this.value)">
          <div class="set-input-label">kg</div>
        </div>
        <div>
          <input class="set-input" type="number" placeholder="reps" value="${s.reps}" inputmode="numeric"
            onchange="updateSet(${ei},${si},'reps',this.value)">
          <div class="set-input-label">reps</div>
        </div>
        <button class="set-done-btn${s.done ? ' done' : ''}" onclick="toggleSetDone(${ei},${si})">✓</button>
      </div>`
    ).join('');

    return `<div class="ex-card">
      <div class="ex-card-header">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-sets-badge">${ex.sets}</div>
      </div>
      ${ex.note ? `<div class="ex-note-border">${ex.note}</div>` : ''}
      <div class="ex-note-border" style="color:var(--text3); font-style:normal; display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px;">
        <span>⏱ ${restTime}</span>
        <span style="color:var(--text3);">Same weight all sets · add load when all reps hit</span>
      </div>
      <div class="set-logger">
        <div class="set-logger-header">
          <span>Working sets — log weight &amp; reps</span>
          <span style="color:${day.color}">${countDoneSets(dd.sets['ex' + ei])} done</span>
        </div>
        <div id="sets_${currentDay}_${ei}">${setRows}</div>
        <button class="add-set-btn" onclick="addSet(${ei})">+ add set</button>
      </div>
    </div>`;
  }).join('');

  const fin = day.finisher;
  let finHtml;
  if (fin.type === 'hiit') {
    let phaseRows = fin.phases.map(p =>
      `<div class="hiit-row"><span class="hiit-phase">${p.label}</span><span class="hiit-time">${p.time}</span></div>`
    ).join('');
    finHtml = `<div class="finisher-card">
      <div class="finisher-label" style="color:${day.color}">🏃 ${fin.label}${fin.optional ? ' (optional)' : ''} · ${fin.total}</div>
      <div class="hiit-block">${phaseRows}</div>
    </div>`;
  }

  const isDone = dd.done;
  document.getElementById('dayPanel').innerHTML = `
    <div class="day-header">
      <span class="day-type-badge" style="background:${day.color}18; color:${day.color}">${day.label}</span>
      <span class="day-title-text">${day.title}</span>
    </div>
    <div class="section-block">
      <div class="section-block-header" onclick="toggleBlock(this)">
        <h3><span>🔥</span> Warm-up — complete before working sets</h3>
        <span class="chevron">▾</span>
      </div>
      <div class="section-block-body">${warmupItems}${warmupNote}</div>
    </div>
    ${exHtml}
    ${finHtml}
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px;">
      <div style="font-size:11px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); margin-bottom:10px;">Progressive overload rules</div>
      <div style="font-size:13px; color:var(--text2); line-height:1.7;">
        <div style="margin-bottom:6px;">✅ <strong style="font-weight:500; color:var(--text);">Hit all reps on all sets?</strong> Add 2.5–5kg next session.</div>
        <div style="margin-bottom:6px;">⚠️ <strong style="font-weight:500; color:var(--text);">Couldn't hit the bottom rep on set 1?</strong> Drop weight by 5–10%. Never grind through bad form to chase numbers.</div>
        <div style="margin-bottom:6px;">📅 <strong style="font-weight:500; color:var(--text);">Deload every 6–8 weeks</strong> — same exercises, drop volume by 40%, lighter weight. One week only, then resume.</div>
        <div>💤 <strong style="font-weight:500; color:var(--text);">Sleep and protein</strong> are where muscle is actually built. Aim for 2g protein per kg of bodyweight daily.</div>
      </div>
    </div>
    <button class="complete-btn${isDone ? ' done' : ''}" onclick="toggleComplete()">
      ${isDone ? '✓ Day Complete' : 'Mark Day Complete'}
    </button>
  `;
}

function toggleBlock(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function countDoneSets(sets) {
  if (!sets) return 0;
  return sets.filter(s => s.done).length;
}

function updateSet(ei, si, field, val) {
  const dd = getDayData(currentWeek, currentDay);
  const key = 'ex' + ei;
  if (!dd.sets) dd.sets = {};
  if (!dd.sets[key]) dd.sets[key] = [];
  if (!dd.sets[key][si]) dd.sets[key][si] = { kg: '', reps: '', done: false };
  dd.sets[key][si][field] = val;
  setDayData(currentWeek, currentDay, dd);
  renderSummary();
  showToast('Saved');
}

function toggleSetDone(ei, si) {
  const dd = getDayData(currentWeek, currentDay);
  const key = 'ex' + ei;
  if (!dd.sets[key][si]) return;
  dd.sets[key][si].done = !dd.sets[key][si].done;
  setDayData(currentWeek, currentDay, dd);
  renderSummary();
  renderDayPanel();
}

function addSet(ei) {
  const dd = getDayData(currentWeek, currentDay);
  const key = 'ex' + ei;
  if (!dd.sets[key]) dd.sets[key] = [];
  dd.sets[key].push({ kg: '', reps: '', done: false });
  setDayData(currentWeek, currentDay, dd);
  renderDayPanel();
}

function toggleComplete() {
  const dd = getDayData(currentWeek, currentDay);
  dd.done = !dd.done;
  setDayData(currentWeek, currentDay, dd);
  renderDayPills();
  renderSummary();
  const btn = document.querySelector('.complete-btn');
  if (btn) {
    btn.classList.toggle('done', dd.done);
    btn.textContent = dd.done ? '✓ Day Complete' : 'Mark Day Complete';
  }
  if (dd.done) showToast('Day logged!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function renderHistory() {
  const weeks = Object.keys(store).sort();
  if (!weeks.length) {
    document.getElementById('historyContent').innerHTML = '<div class="no-data" style="padding:40px 0;">No history yet — start logging!</div>';
    return;
  }
  let html = '';
  weeks.reverse().forEach(wk => {
    const wNum = parseInt(wk.replace('w',''));
    html += `<div class="history-week"><div class="history-week-header">Week ${wNum} — ${formatWeekDates(wNum)}</div>`;
    PLAN.forEach((day, di) => {
      const dd = store[wk] && store[wk]['d' + di];
      if (!dd) return;
      let setCount = 0, vol = 0;
      if (dd.sets) Object.values(dd.sets).forEach(ex => ex.forEach(s => { if (s.done) { setCount++; vol += (parseFloat(s.kg)||0)*(parseInt(s.reps)||0); } }));
      if (!setCount && !dd.done) return;
      html += `<div class="history-day-row">
        <div><div class="history-day-name">${day.title}</div>
        <div class="history-day-meta">${setCount} sets · ${Math.round(vol)} kg volume</div></div>
        <span class="history-tag" style="background:${day.color}18;color:${day.color}">${dd.done ? '✓ done' : 'partial'}</span>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('historyContent').innerHTML = html || '<div class="no-data" style="padding:40px 0;">No completed days yet.</div>';
}

function renderProgress() {
  const allEx = [];
  PLAN.forEach((day, di) => {
    day.exercises.forEach((ex, ei) => {
      allEx.push({ label: ex.name, di, ei });
    });
  });
  const sel = document.getElementById('exSelect');
  if (!sel.options.length) {
    allEx.forEach((e, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = e.label;
      sel.appendChild(opt);
    });
  }
  renderChart();
}

function renderChart() {
  const sel = document.getElementById('exSelect');
  if (!sel.options.length) return;
  const idx = parseInt(sel.value);
  const allEx = [];
  PLAN.forEach((day, di) => day.exercises.forEach((ex, ei) => allEx.push({ di, ei })));
  const { di, ei } = allEx[idx];
  const key = 'ex' + ei;

  const points = [];
  Object.keys(store).sort().forEach(wk => {
    const wNum = parseInt(wk.replace('w',''));
    const dd = store[wk] && store[wk]['d' + di];
    if (!dd || !dd.sets || !dd.sets[key]) return;
    const maxKg = Math.max(...dd.sets[key].filter(s => s.done && s.kg).map(s => parseFloat(s.kg) || 0));
    if (maxKg > 0) points.push({ week: wNum, kg: maxKg });
  });

  if (!points.length) {
    document.getElementById('chartWrap').innerHTML = '<div class="no-data">No data logged yet for this exercise.</div>';
    return;
  }

  const maxKg = Math.max(...points.map(p => p.kg));
  const minKg = Math.min(...points.map(p => p.kg));
  const range = maxKg - minKg || 1;
  const W = 320, H = 120, pad = 24;
  const xStep = points.length > 1 ? (W - pad*2) / (points.length - 1) : 0;

  const pts = points.map((p, i) => {
    const x = pad + i * xStep;
    const y = H - pad - ((p.kg - minKg) / range) * (H - pad * 2);
    return { x, y, ...p };
  });

  const pathD = pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(' ');
  const areaD = `${pathD} L${pts[pts.length-1].x},${H-pad} L${pts[0].x},${H-pad} Z`;

  const circles = pts.map(p =>
    `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#c8ff57"/>
     <text x="${p.x}" y="${p.y - 8}" fill="#c8ff57" font-size="10" text-anchor="middle" font-family="DM Mono,monospace">${p.kg}kg</text>
     <text x="${p.x}" y="${H - 4}" fill="#5c5b63" font-size="9" text-anchor="middle" font-family="DM Mono,monospace">W${p.week}</text>`
  ).join('');

  document.getElementById('chartWrap').innerHTML = `
    <div style="font-size:12px;color:#9998a0;margin-bottom:10px;font-family:'DM Mono',monospace;">Max weight per session</div>
    <div class="chart-area">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <path d="${areaD}" fill="rgba(200,255,87,0.07)" stroke="none"/>
        <path d="${pathD}" fill="none" stroke="#c8ff57" stroke-width="2"/>
        ${circles}
      </svg>
    </div>
    <div style="font-size:11px;color:#5c5b63;text-align:right;font-family:'DM Mono',monospace;">${points.length} session${points.length>1?'s':''} logged</div>
  `;
}

renderAll();
</script>
</body>
</html>
